name: apply-npm-tag-to-version
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (ex: latest):'
        required: true
        type: string
      version:
        description: 'Version (ex: 5.2.0):'
        required: true
        type: string
      confirm:
        description: 'Check this box to confirm that you understand that applying a tag using this action is only recommended for emergency rollback situations and that you understand the consequences.'
        required: true
        type: boolean

jobs:
  publish_package:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm Trusted Publishing (OIDC).
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Fail if not confirmed
        if: ${{ github.event.inputs.confirm != 'true' }}
        run: |
          echo "::error::You did not confirm, so dist-tag not called."
          exit 1

      # Managing dist-tags via Trusted Publishing requires a recent npm (>= 11.21.0), and the trusted publisher
      # configuration on npmjs.com must have "Allow npm dist-tag" enabled.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Apply tag
        # Pass user-supplied inputs via the environment rather than direct ${{ }} interpolation, so they are
        # treated as data and cannot inject shell commands.
        env:
          INPUTS_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUTS_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "You have confirmed that using this action is only recommended for emergency rollback situations and that you are responsible for manually applying the ${INPUTS_TAG_NAME} tag to @salesforce/plugin-code-analyzer@${INPUTS_VERSION}."
          echo "Applying tag..."
          npm dist-tag add "@salesforce/plugin-code-analyzer@${INPUTS_VERSION}" "${INPUTS_TAG_NAME}"
